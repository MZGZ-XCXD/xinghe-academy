name: 部署《星河实验学园》到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 / undici 8 要求 Node ^22.22.2 || ^24.15.0 || >=26，Node 20 会让 jsdom 加载失败
          node-version: 24
          cache: npm

      - name: 环境信息
        run: node -v && npm -v

      - name: 安装依赖
        run: npm ci

      - name: 跑测试（核心逻辑回归）
        run: npm test

      - name: 打包单文件版
        run: npm run build:single

      - name: 整理要发布的文件
        run: |
          mkdir -p _site
          # 注意：要发布的是「单文件版」（JS/CSS 已内联进 HTML），
          # 不是 dist-single/index.html —— 那个只有 700 多字节，引用外部 app.js / app.css，
          # 直接发布会白屏。
          cp "outputs/星河实验学园.html" _site/index.html
          cp "outputs/校园内容.js" _site/ 2>/dev/null || true
          cp "outputs/如何添加内容.md" _site/ 2>/dev/null || true
          size=$(stat -c%s _site/index.html)
          echo "发布首页大小：$size 字节"
          # 单文件版应当有几百 KB；太小说明没内联，直接让这一步失败，避免又发布一个白屏页面
          test "$size" -gt 100000

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
